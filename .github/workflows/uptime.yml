name: Uptime Monitor

on:
  schedule:
    # Every 15 minutes, not every 5 — and the reason is money, not monitoring.
    #
    # /api/health runs `prisma.depot.count()`, a real query against Postgres.
    # Neon suspends compute after 5 minutes of inactivity, so a probe on a
    # 5-minute cron raced that timer and the database effectively never slept.
    # On Neon's Free plan that cost nothing. On a usage-based paid plan, compute
    # is billed at $0.106/CU-hour, and a database that never sleeps is billed
    # for all ~730 hours in a month — roughly $19/month at 0.25 CU, ~$77 at 1 CU,
    # for an app with no users yet. Scale-to-zero was enabled in the Neon console
    # the whole time; this workflow was quietly preventing it from ever engaging.
    #
    # 15 minutes leaves a real idle gap, so the compute actually suspends. The
    # cost is coarser outage detection: an incident surfaces up to 15 minutes
    # later instead of 5. For a shift-swap board that is an acceptable trade —
    # and once operators are using it daily their own traffic keeps the database
    # warm during shift-change hours anyway, at which point this is worth
    # revisiting.
    - cron: '*/15 * * * *'
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        id: health
        run: |
          # Retry once before alerting. Two flake modes the previous version hit:
          #   1. A cold-start blip (Vercel function cold + Neon Postgres cold)
          #      can exceed the previous 10-second curl timeout even on a
          #      healthy site.
          #   2. The apex wmnyshiftswap.com redirects (HTTP 307) to the
          #      canonical www.wmnyshiftswap.com. Without -L the runner saw
          #      the 307 as the final status and false-alarmed.
          # Fixes both: -L follows redirects, --max-time 30 covers cold starts,
          # we hit the canonical www host directly to skip the redirect, and we
          # retry once with a 10s gap before declaring failure.
          attempt() {
            curl -sL -o /dev/null -w "%{http_code}" --max-time 30 https://www.wmnyshiftswap.com/api/health
          }

          STATUS=$(attempt)
          if [ "$STATUS" = "200" ]; then
            echo "OK — HTTP $STATUS (first attempt)"
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "First attempt returned HTTP $STATUS — retrying in 10s"
          sleep 10
          STATUS=$(attempt)
          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [ "$STATUS" != "200" ]; then
            echo "HEALTH CHECK FAILED — HTTP $STATUS (after retry)"
            exit 1
          fi
          echo "OK — HTTP $STATUS (recovered on retry)"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'uptime',
              state: 'open',
            });
            // Don't open a duplicate if one is already open
            if (issues.length > 0) {
              console.log('Uptime issue already open, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Uptime alert: /api/health returned HTTP ${{ steps.health.outputs.status }}`,
              body: [
                '## Site is down',
                '',
                `**URL:** https://www.wmnyshiftswap.com/api/health`,
                `**Status:** HTTP ${{ steps.health.outputs.status }}`,
                `**Time:** ${new Date().toISOString()}`,
                '',
                '### Checklist',
                '- [ ] Check Vercel dashboard for failed deployments',
                '- [ ] Check Neon DB status at console.neon.tech',
                '- [ ] Check Sentry for recent errors',
                '- [ ] If needed, roll back via Vercel → Deployments → Promote last good deploy',
                '',
                'See `RUNBOOK.md` for full rollback procedures.',
              ].join('\n'),
              labels: ['uptime'],
            });

      - name: Close resolved issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'uptime',
              state: 'open',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Site recovered at ${new Date().toISOString()} — /api/health returned 200.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

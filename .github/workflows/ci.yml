name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      # Lint was never in CI, so `npm run lint` had accumulated 19 errors
      # unnoticed. It is clean now; --max-warnings 10 in the script holds the
      # line at the current warning count so new ones fail the build.
      - run: npm run lint
      - run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_RESET_SECRET: ci-placeholder-do-not-use-in-prod
          NEXT_PUBLIC_APP_URL: https://we-move-ny-shift-swap.vercel.app
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: placeholder
          RESEND_API_KEY: placeholder
          EMAIL_FROM: placeholder@resend.dev
          VAPID_EMAIL: placeholder@example.com
          VAPID_PUBLIC_KEY: placeholder
          VAPID_PRIVATE_KEY: placeholder
          CRON_SECRET: placeholder
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder

  test:
    runs-on: ubuntu-latest

    # Throwaway Postgres per run. The DB-backed tests self-gate on
    # DATABASE_URL (`{ skip: !DB }`), so without a database they silently skip
    # and the job would go green having verified almost nothing. A service
    # container keeps them running on every PR with no shared-infra risk and no
    # secret to manage.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shiftswap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shiftswap_test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      JWT_REFRESH_SECRET: ci-test-refresh-secret-do-not-use-in-prod
      JWT_RESET_SECRET: ci-test-reset-secret-do-not-use-in-prod
      CRON_SECRET: ci-test-cron-secret
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci-test-redis-token

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      # db push + partial-indexes.sql, NOT migrate deploy.
      #
      # This step was briefly switched to `migrate deploy` on the theory that
      # Prisma sorts migrations lexicographically, where '2' (0x32) precedes
      # '_' (0x5F) and 20260401214939_init would sort first. That theory was
      # wrong and CI caught it on the first pull_request run: Prisma orders by
      # the numeric timestamp prefix, so the fifteen hand-named 8-digit dirs
      # (20260401, 20260402, ...) all sort AHEAD of the 14-digit baseline
      # 20260401214939_init. init therefore runs last, and the first migration
      # applied dies with 42P01 relation "users" does not exist.
      #
      # Reproduced 2026-09-26 against an empty Postgres 16: replaying in
      # numeric-prefix order fails on 20260401_add_agreements_push_roles with
      # exactly that error; replaying with init first, all 16 apply cleanly.
      # So the SQL is fine and the directory NAMES are the defect.
      #
      # Fixing it means renaming those fifteen dirs to real 14-digit
      # timestamps, which changes the names recorded in _prisma_migrations.
      # Production would then see fifteen unknown migrations and try to apply
      # them over an existing schema — verified to fail immediately with
      # 'type "UserRole" already exists'. Since vercel-build runs
      # `prisma migrate deploy && next build`, that would break production
      # deploys. The rename needs a deliberate `migrate resolve --applied`
      # reconciliation against production first. Tracked separately; do not
      # switch this step back until that is done.
      #
      # db push builds the full schema, then partial-indexes.sql adds the two
      # partial unique indexes db push cannot express. Without them the conflict
      # tests return 201 instead of 409. See prisma/partial-indexes.sql.
      - run: npx prisma db push --accept-data-loss
      - run: npx prisma db execute --file prisma/partial-indexes.sql

      # The 409 duplicate-proposal path depends entirely on these two indexes,
      # and their absence is silent — the tests return 201 instead of 409, which
      # reads as a logic regression rather than a missing constraint. Assert
      # them explicitly so a migration that drops one fails here.
      - name: Assert partial unique indexes exist
        run: |
          count=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexdef ILIKE '%UNIQUE%' AND indexdef ILIKE '%WHERE%';")
          echo "partial unique indexes found: $count"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 partial unique indexes (see prisma/partial-indexes.sql), found $count"
            psql "$DATABASE_URL" -c "SELECT indexname FROM pg_indexes WHERE schemaname='public';"
            exit 1
          fi

      - name: Start Redis REST test adapter
        run: |
          node test/redis-rest-server.mjs > redis-rest.log 2>&1 &
          echo $! > redis-rest.pid

      - name: Wait for Redis REST test adapter
        run: |
          for i in {1..20}; do
            curl --fail --silent -X POST http://localhost:8079 \
              -H 'Authorization: Bearer ci-test-redis-token' \
              -H 'Content-Type: application/json' \
              --data '["PING"]' && exit 0
            sleep 1
          done
          cat redis-rest.log
          exit 1

      - name: Run tests
        run: |
          trap 'kill "$(cat redis-rest.pid)" 2>/dev/null || true' EXIT
          set -o pipefail
          timeout 5m npm test 2>&1 | tee test-output.txt

      # Canary: a green run with DATABASE_URL unset is indistinguishable from a
      # real pass, because the DB tests self-gate via `{ skip: !DB }`. Assert
      # that a specific DB-backed test actually executed.
      #
      # One skip IS expected and must not fail the job: "A12 (grace window,
      # Redis required)" gates on Redis, which CI has no service for.
      #
      # Match both output formats. node --test emits spec ("✔ name", "ℹ pass N")
      # on a TTY but TAP ("ok 12 - name", "# pass N") when piped, which is what
      # Actions gets. A spec-only pattern silently never matches here.
      - name: Verify DB-backed tests actually ran
        run: |
          if ! grep -qE '^(✔|ok [0-9]+ -).*conflict paths' test-output.txt; then
            echo "::error::DB-backed tests did not run — DATABASE_URL is not reaching the suite"
            grep -E '^(ℹ|#) (tests|pass|fail|skipped)' test-output.txt || true
            exit 1
          fi
          echo "DB-backed tests confirmed running:"
          grep -E '^(ℹ|#) (tests|pass|fail|skipped)' test-output.txt
          if ! grep -qE '^(✔|ok [0-9]+ -).*logout-all rejects a previously issued refresh token' test-output.txt; then
            echo "::error::Redis-backed logout-all test did not execute"
            exit 1
          fi
          if ! grep -qE '^(✔|ok [0-9]+ -).*A12 \(grace window, Redis required\)' test-output.txt; then
            echo "::error::Redis-backed rotation grace test did not execute"
            exit 1
          fi
